    <ellipse cx="40" cy="80" rx="110" ry="40" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="3"/>
    <ellipse cx="40" cy="80" rx="110" ry="40" fill="none" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="3" transform="rotate(60 40 80)"/>
    <ellipse cx="40" cy="80" rx="110" ry="40" fill="none" stroke="#f0abfc" stroke-opacity="0.55" stroke-width="3" transform="rotate(120 40 80)"/>
  </g>
  <text x="320" y="290" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="700" fill="url(#g-text)">Helix</text>
  <text x="320" y="360" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="500" fill="#cbd5e1">Atomic work-breakdown for AI coding agents.</text>
  <text x="320" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Ship reviewable units, not 4,000-line diffs.</text>
