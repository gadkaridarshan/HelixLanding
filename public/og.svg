<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="22%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="82%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>
  <rect width="1200" height="630" fill="url(#glow-violet)"/>

  <!-- Atom / orbit motif -->
  <g transform="translate(940,180)" opacity="0.85">
    <circle r="120" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse rx="180" ry="60" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" transform="rotate(-25)"/>
    <ellipse rx="180" ry="60" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5" transform="rotate(35)"/>
    <ellipse rx="180" ry="60" fill="none" stroke="#67e8f9" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(95)"/>
    <circle r="14" fill="#22d3ee"/>
    <circle cx="180" cy="0" r="8" fill="#a78bfa" transform="rotate(-25)"/>
    <circle cx="-180" cy="0" r="8" fill="#67e8f9" transform="rotate(35)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(80,200)">
    <rect width="56" height="56" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="28" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#67e8f9">H</text>
    <text x="80" y="42" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="42" font-weight="700" fill="#e2e8f0">Helix</text>
  </g>

  <!-- Headline -->
  <text x="80" y="340" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="700" fill="url(#text)">Atomic work-breakdown</text>
  <text x="80" y="412" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="700" fill="#e2e8f0">for AI coding agents.</text>

  <!-- Sub -->
  <text x="80" y="478" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Decompose every prompt into reviewable units. Ship small PRs.</text>

  <!-- Footer -->
  <text x="80" y="568" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#64748b">helix-ai-orchestrator.vercel.app</text>
</svg>