<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Helix — Atomic work-breakdown for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="22%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="82%" cy="68%" r="48%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5f5"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>
  <rect width="1200" height="630" fill="url(#glow-violet)"/>

  <!-- decorative atom orbits -->
  <g stroke="#22d3ee" stroke-opacity="0.18" fill="none" stroke-width="1.5">
    <ellipse cx="980" cy="315" rx="220" ry="90" transform="rotate(-22 980 315)"/>
    <ellipse cx="980" cy="315" rx="220" ry="90" transform="rotate(22 980 315)"/>
    <ellipse cx="980" cy="315" rx="220" ry="90" transform="rotate(90 980 315)"/>
    <circle cx="980" cy="315" r="14" fill="#22d3ee" fill-opacity="0.85"/>
    <circle cx="1200" cy="315" r="6" fill="#a78bfa" fill-opacity="0.85"/>
    <circle cx="760" cy="315" r="6" fill="#a78bfa" fill-opacity="0.85"/>
  </g>

  <!-- wordmark + headline -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" fill="url(#headline)">
    <text x="80" y="170" font-size="56" font-weight="700" fill="url(#wordmark)" letter-spacing="-1">Helix</text>
    <text x="80" y="300" font-size="78" font-weight="700" letter-spacing="-2">Atomic work-breakdown</text>
    <text x="80" y="380" font-size="78" font-weight="700" letter-spacing="-2">for AI coding agents.</text>
    <text x="80" y="470" font-size="30" font-weight="500" fill="#cbd5f5" opacity="0.85">Decompose · Execute · Verify · Ship reviewable PRs</text>
  </g>

  <!-- CTA pill -->
  <g transform="translate(80, 510)">
    <rect width="260" height="64" rx="32" fill="#22d3ee"/>
    <text x="130" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#020617">helix-ai.dev →</text>
  </g>
</svg>