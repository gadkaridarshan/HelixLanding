<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Helix — Atomic work-breakdown for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1437"/>
      <stop offset="100%" stop-color="#1a0b3d"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowViolet)"/>

  <g transform="translate(900,315)">
    <circle r="160" fill="none" stroke="rgba(34,211,238,0.25)" stroke-width="2"/>
    <circle r="120" fill="none" stroke="rgba(167,139,250,0.25)" stroke-width="2"/>
    <circle r="80" fill="none" stroke="rgba(34,211,238,0.35)" stroke-width="2"/>
    <ellipse rx="180" ry="70" fill="none" stroke="rgba(167,139,250,0.3)" stroke-width="2" transform="rotate(30)"/>
    <ellipse rx="180" ry="70" fill="none" stroke="rgba(34,211,238,0.3)" stroke-width="2" transform="rotate(-30)"/>
    <circle r="10" fill="#22d3ee"/>
    <circle cx="160" cy="0" r="6" fill="#a78bfa"/>
    <circle cx="-140" cy="70" r="5" fill="#67e8f9"/>
    <circle cx="120" cy="-100" r="5" fill="#a78bfa"/>
  </g>

  <g transform="translate(80,160)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="url(#brand)" letter-spacing="-1">Helix</text>
    <text x="0" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Atomic work-breakdown</text>
  </g>

  <g transform="translate(80,300)" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-weight="700" letter-spacing="-2">
    <text x="0" y="0" font-size="64">Atomic work-breakdown</text>
    <text x="0" y="80" font-size="64">for AI coding agents.</text>
  </g>

  <g transform="translate(80,470)" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400">
    <text x="0" y="0">Decompose every prompt. Verify every unit.</text>
    <text x="0" y="34">Ship small, reviewable PRs — not one sprawling diff.</text>
  </g>

  <g transform="translate(80,560)">
    <rect width="320" height="48" rx="24" fill="url(#brand)"/>
    <text x="160" y="31" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#020617" text-anchor="middle">helix-ai-orchestrator.vercel.app</text>
  </g>
</svg>