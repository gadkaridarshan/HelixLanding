<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="55%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Atom / orbit motif on the right -->
  <g transform="translate(900, 315)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.35" />
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.4" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#a5f3fc" stroke-width="2" opacity="0.3" transform="rotate(90)" />
    <circle cx="0" cy="0" r="28" fill="#22d3ee" />
    <circle cx="160" cy="0" r="10" fill="#67e8f9" transform="rotate(30)" />
    <circle cx="-160" cy="0" r="10" fill="#67e8f9" transform="rotate(-30)" />
    <circle cx="0" cy="60" r="10" fill="#a5f3fc" transform="rotate(90)" />
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" fill="#e2e8f0">
    <text x="80" y="200" font-size="48" font-weight="700" fill="#22d3ee" letter-spacing="6">HELIX</text>
    <text x="80" y="320" font-size="72" font-weight="800" fill="url(#text)">Atomic work-breakdown</text>
    <text x="80" y="400" font-size="72" font-weight="800" fill="url(#text)">for AI coding agents</text>
    <text x="80" y="470" font-size="28" font-weight="400" fill="#94a3b8">Decompose. Orchestrate. Verify. Ship small PRs.</text>
    <text x="80" y="560" font-size="22" font-weight="500" fill="#64748b">helix-ai-orchestrator.vercel.app</text>
  </g>
</svg>