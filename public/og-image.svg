<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>
  <rect width="1200" height="630" fill="url(#glow-violet)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Atom / orbit motif (right side) -->
  <g transform="translate(900, 315)" fill="none" stroke-width="2">
    <circle r="180" stroke="#22d3ee" stroke-opacity="0.35"/>
    <ellipse rx="180" ry="70" stroke="#a78bfa" stroke-opacity="0.45" transform="rotate(30)"/>
    <ellipse rx="180" ry="70" stroke="#22d3ee" stroke-opacity="0.35" transform="rotate(-45)"/>
    <circle r="22" fill="#22d3ee" fill-opacity="0.9" stroke="none"/>
    <circle cx="160" cy="-30" r="10" fill="#a78bfa" fill-opacity="0.9" stroke="none"/>
    <circle cx="-130" cy="90" r="8" fill="#22d3ee" fill-opacity="0.9" stroke="none"/>
    <circle cx="60" cy="150" r="6" fill="#f472b6" fill-opacity="0.9" stroke="none"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="22" font-weight="600" fill="#67e8f9" letter-spacing="4">
    ATOMIC WORK BREAKDOWN
  </text>

  <!-- Wordmark -->
  <text x="80" y="320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="120" font-weight="800" fill="url(#wordmark)" letter-spacing="-2">
    Helix
  </text>

  <!-- Tagline -->
  <text x="80" y="400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="36" font-weight="500" fill="#e2e8f0">
    The orchestrator for AI coding agents
  </text>

  <!-- Sub-line -->
  <text x="80" y="450" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="24" font-weight="400" fill="#94a3b8">
    Decompose any goal into reviewable, atomic PRs.
  </text>

  <!-- Footer pill -->
  <g transform="translate(80, 540)">
    <rect width="220" height="48" rx="24" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="110" y="32" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="18" font-weight="600" fill="#67e8f9">
      helix-ai-orchestrator.vercel.app
    </text>
  </g>
</svg>