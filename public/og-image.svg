<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="atom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Atom/orbit motif right -->
  <g transform="translate(900 315)">
    <circle r="18" fill="url(#atom)"/>
    <ellipse rx="170" ry="60" fill="none" stroke="url(#atom)" stroke-width="6" transform="rotate(30)"/>
    <ellipse rx="170" ry="60" fill="none" stroke="url(#atom)" stroke-width="6" transform="rotate(-30)"/>
    <ellipse rx="170" ry="60" fill="none" stroke="url(#atom)" stroke-width="6" transform="rotate(90)"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Inter, system-ui, sans-serif" fill="#e2e8f0">
    <text x="80" y="200" font-size="34" font-weight="500" fill="#22d3ee" letter-spacing="6">HELIX</text>
    <text x="80" y="290" font-size="68" font-weight="700">Atomic work breakdown</text>
    <text x="80" y="360" font-size="68" font-weight="700">for AI coding agents.</text>
    <text x="80" y="430" font-size="26" font-weight="400" fill="#94a3b8">Decompose → Orchestrate → Ship reviewable work, every run.</text>
    <text x="80" y="540" font-size="20" font-weight="500" fill="#64748b">helix-ai-orchestrator.vercel.app</text>
  </g>
</svg>