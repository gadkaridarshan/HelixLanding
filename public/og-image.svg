<!-- helix: public/og-image.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Helix — Atomic Work-Breakdown Orchestrator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#1a1240"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="520" ry="260" fill="url(#glow)"/>

  <!-- Helix mark: stylized double helix -->
  <g transform="translate(120,180)">
    <g fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
      <path d="M0 0 C 40 60, 100 60, 140 0 S 240 -60, 280 0 S 380 60, 420 0"/>
      <path d="M0 0 C 40 -60, 100 -60, 140 0 S 240 60, 280 0 S 380 -60, 420 0"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="140" cy="0" r="8"/>
      <circle cx="280" cy="0" r="8"/>
      <circle cx="420" cy="0" r="8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="120" y="360" fill="#ffffff" font-size="84" font-weight="700" letter-spacing="-2">Helix</text>
    <text x="120" y="420" fill="#cbd5e1" font-size="28" font-weight="500">Atomic Work-Breakdown Orchestrator</text>
    <text x="120" y="478" fill="#94a3b8" font-size="22" font-weight="400">Plan · Write · Ship — in reviewable steps.</text>
  </g>

  <!-- Bottom badge -->
  <g transform="translate(120,540)">
    <rect x="0" y="0" rx="999" ry="999" width="280" height="40" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="22" cy="20" r="5" fill="#34d399"/>
    <text x="40" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">Now shipping · Vercel + GitHub ready</text>
  </g>
</svg>