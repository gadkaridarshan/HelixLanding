<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Helix — Atomic Work-Breakdown Orchestrator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="60%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Decorative helix glyph (left) -->
  <g transform="translate(120,180)" opacity="0.95">
    <g fill="none" stroke="url(#helix)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 20 C 200 20, 80 140, 240 140 C 80 140, 200 260, 40 260"/>
      <path d="M240 20 C 80 20, 200 140, 40 140 C 200 140, 80 260, 240 260"/>
    </g>
    <g>
      <circle cx="40"  cy="20"  r="6" fill="#22d3ee"/>
      <circle cx="240" cy="20"  r="6" fill="#7c3aed"/>
      <circle cx="40"  cy="140" r="6" fill="#34d399"/>
      <circle cx="240" cy="140" r="6" fill="#34d399"/>
      <circle cx="40"  cy="260" r="6" fill="#22d3ee"/>
      <circle cx="240" cy="260" r="6" fill="#7c3aed"/>
    </g>
  </g>

  <!-- Wordmark / title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#f8fafc">
    <text x="430" y="245" font-size="84" font-weight="800" letter-spacing="-2">Helix</text>
    <text x="432" y="305" font-size="32" font-weight="500" fill="#cbd5e1">Atomic Work-Breakdown Orchestrator</text>
    <text x="432" y="380" font-size="26" font-weight="400" fill="#94a3b8">
      Plan, write, and ship code in reviewable steps.
    </text>
    <text x="432" y="418" font-size="26" font-weight="400" fill="#94a3b8">
      Bounded writes. Language-locked. Audit-friendly.
    </text>
  </g>

  <!-- Footer pill -->
  <g transform="translate(432,520)">
    <rect x="0" y="0" rx="22" ry="22" width="290" height="44" fill="#0b1020" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="22" r="6" fill="#34d399"/>
    <text x="40" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">
      helix-ai-orchestrator.vercel.app
    </text>
  </g>
</svg>