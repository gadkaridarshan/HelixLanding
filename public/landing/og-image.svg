<!-- helix: public/landing/og-image.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(80,160)">
    <text font-family="Space Grotesk, Inter, sans-serif" font-size="92" font-weight="700" fill="#ffffff">Helix</text>
    <text y="80" font-family="Space Grotesk, Inter, sans-serif" font-size="46" font-weight="500" fill="url(#fg)">Atomic Work-Breakdown Orchestrator</text>
    <text y="170" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">From prompt to atomic PRs — coherent code, every time.</text>
  </g>
  <g transform="translate(820,180)">
    <circle cx="120" cy="120" r="110" fill="none" stroke="url(#fg)" stroke-width="3"/>
    <circle cx="120" cy="120" r="22" fill="#22d3ee"/>
    <ellipse cx="120" cy="120" rx="110" ry="36" fill="none" stroke="url(#fg)" stroke-width="2"/>
    <ellipse cx="120" cy="120" rx="110" ry="36" fill="none" stroke="url(#fg)" stroke-width="2" transform="rotate(60 120 120)"/>
    <ellipse cx="120" cy="120" rx="110" ry="36" fill="none" stroke="url(#fg)" stroke-width="2" transform="rotate(-60 120 120)"/>
  </g>
</svg>