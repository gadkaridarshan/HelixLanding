<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#0a0f1f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Atom/orbit motif -->
  <g transform="translate(900 315)" fill="none" stroke="#22d3ee" stroke-opacity="0.45">
    <ellipse cx="0" cy="0" rx="200" ry="80" />
    <ellipse cx="0" cy="0" rx="200" ry="80" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="200" ry="80" transform="rotate(-60)" />
    <circle cx="0" cy="0" r="14" fill="#22d3ee" stroke="none" />
  </g>

  <!-- Brand -->
  <text x="80" y="180" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="6">
    ATOMIC WORK-BREAKDOWN ORCHESTRATOR
  </text>

  <text x="80" y="320" fill="url(#text)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="96" font-weight="700">
    Helix
  </text>

  <text x="80" y="420" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="600">
    Ship atomic PRs
  </text>
  <text x="80" y="478" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="600">
    with an AI coding orchestrator.
  </text>

  <text x="80" y="560" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">
    helix-ai-orchestrator.vercel.app
  </text>
</svg>