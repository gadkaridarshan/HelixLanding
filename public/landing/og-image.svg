<!-- helix: public/landing/og-image.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="100%" stop-color="#0b1124" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />
  <g transform="translate(80,160)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#title)" />
    <text x="40" y="58" font-family="Inter, sans-serif" font-size="48" font-weight="800" fill="#050816" text-anchor="middle">H</text>
    <text x="100" y="58" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">Helix</text>
  </g>
  <text x="80" y="340" font-family="Inter, sans-serif" font-size="68" font-weight="800" fill="url(#title)">Ship AI code in</text>
  <text x="80" y="420" font-family="Inter, sans-serif" font-size="68" font-weight="800" fill="#f8fafc">small, reviewable units.</text>
  <text x="80" y="500" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">The atomic work-breakdown orchestrator for AI coding agents.</text>
</svg>